<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Supers / Midnight Siege</title><link rel="stylesheet" href="style.css?v=touch-2"><script src="game.js?v=touch-2" defer></script></head>
<body><main>
<header><div class="brand">SUPERS<span> / MIDNIGHT SIEGE</span></div><div id="stage">HERO SELECT</div><button type="button" id="touch-toggle" aria-pressed="false">TOUCH CONTROLS</button></header>
<div class="cabinet">
<canvas id="screen" width="480" height="270" aria-label="Supers side-scrolling game"></canvas>
<section id="menu" aria-labelledby="title"><p class="kicker">MIDNIGHT SIEGE</p><h1 id="title">CHOOSE YOUR HERO</h1><div id="roster"></div><p id="description"></p><button id="start">START MISSION</button></section>
</div>
<div id="touch-controls" role="group" aria-label="Touch controls" hidden>
  <div class="touch-pad" role="group" aria-label="Movement">
    <button type="button" data-key="KeyA" aria-label="Move left">◀</button>
    <button type="button" data-key="KeyD" aria-label="Move right">▶</button>
  </div>
  <div class="touch-pad" role="group" aria-label="Jump and abilities">
    <button type="button" data-key="Space">Jump</button>
    <button type="button" data-key="KeyJ">J</button>
    <button type="button" data-key="KeyK">K</button>
    <button type="button" data-key="KeyL">L</button>
  </div>
</div>
<footer><div class="keyboard-help"><kbd>A</kbd> <kbd>D</kbd> Move <kbd>W</kbd> <kbd>S</kbd> Stairs / Flight <kbd>Space</kbd> Jump</div><div id="powers"></div><button id="pause" hidden>PAUSE</button></footer>
</main></body></html>
