<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e0b1a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Supers / Midnight Siege</title><link rel="stylesheet" href="style.css?v=touch-4"><script src="game.js?v=touch-4" defer></script></head>
<body><main>
<header><div class="brand">SUPERS<span> / MIDNIGHT SIEGE</span></div><div id="stage">HERO SELECT</div><div class="display-controls">
  <button type="button" id="touch-toggle" aria-pressed="false">TOUCH CONTROLS</button>
  <button type="button" id="fullscreen" hidden>FULLSCREEN</button>
</div></header>
<div class="game-deck">
<div class="screen-slot">
<div class="cabinet">
<canvas id="screen" width="480" height="270" aria-label="Supers side-scrolling game"></canvas>
<section id="menu" aria-labelledby="title"><p class="kicker">MIDNIGHT SIEGE</p><h1 id="title">CHOOSE YOUR HERO</h1><div id="roster"></div><p id="description"></p><button id="start">START MISSION</button></section>
</div>
</div>
<div id="touch-controls" role="group" aria-label="Touch controls" hidden>
  <div class="touch-pad movement-pad" role="group" aria-label="Movement">
    <button type="button" data-key="KeyA" aria-label="Move left">◀</button>
    <button type="button" data-key="KeyD" aria-label="Move right">▶</button>
  </div>
  <div class="touch-pad action-pad" role="group" aria-label="Jump and abilities">
    <button type="button" data-key="KeyJ">J</button>
    <button type="button" data-key="KeyK">K</button>
    <button type="button" data-key="KeyL">L</button>
    <button type="button" data-key="Space">Jump</button>
  </div>
</div>
</div>
<footer><div class="keyboard-help"><kbd>A</kbd> <kbd>D</kbd> Move <kbd>W</kbd> <kbd>S</kbd> Stairs / Flight <kbd>Space</kbd> Jump</div><div id="powers"></div><button id="pause" hidden>PAUSE</button></footer>
<dialog id="fullscreen-help" aria-labelledby="fullscreen-title">
  <h2 id="fullscreen-title">Play without browser tabs</h2>
  <p>Open the browser’s Share or menu and choose <strong>Add to Home Screen</strong> or <strong>Install app</strong>. Turn on <strong>Open as Web App</strong> if it appears. Then launch Supers from the new icon.</p>
  <form method="dialog"><button>GOT IT</button></form>
</dialog>
</main></body></html>
